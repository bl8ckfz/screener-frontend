<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The same file answers every route, so the title and description are
         the site's, not a page's — and there is no canonical link here for
         that reason: one would declare /terms and /privacy copies of /. -->
    <meta name="description" content="Coin-Sniffer scans 200+ crypto futures pairs every day. Each qualifying zone comes with its entry, stop and targets, its live status, and a public record of how it ended, losses included." />
    <meta name="theme-color" content="#000000" />
    <!-- Link previews (X, Telegram, Discord, Facebook). This is a single-page
         app, so crawlers only ever read this file: the tags describe the site
         as a whole, and every shared URL gets the same card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Coin-Sniffer" />
    <meta property="og:url" content="https://www.coin-sniffer.com/" />
    <meta property="og:title" content="Coin-Sniffer — find crypto setups worth watching" />
    <meta property="og:description" content="200+ crypto futures pairs scanned every day. Each qualifying zone comes with its plan, its live status and a public record of how it ended, losses included. 7 days free." />
    <meta property="og:image" content="https://www.coin-sniffer.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Coin-Sniffer: find setups worth watching, know the plan, see what happened" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Coin-Sniffer — find crypto setups worth watching" />
    <meta name="twitter:description" content="200+ crypto futures pairs scanned every day. Every zone tracked to its outcome, losses included. 7 days free." />
    <meta name="twitter:image" content="https://www.coin-sniffer.com/og-image.png" />
    <title>Coin-Sniffer — daily crypto futures scanner with a public record</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
